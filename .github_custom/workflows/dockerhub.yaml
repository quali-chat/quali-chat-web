name: Dockerhub
on:
  workflow_dispatch: {}
  push:
    branches:
      - 'develop'
      - 'main'
concurrency: ${{ github.workflow }}-${{ github.ref_name }}

jobs:
  buildx:
    name: Docker Buildx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # needed for docker-package to be able to calculate the version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3
        with:
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5
        with:
          images: |
            qualichat/qualichat-web
          tags: |
            type=ref,enable=true,event=branch
            type=ref,enable=true,event=tag
            type=raw,enable=true,value={{branch}},event=workflow_dispatch
          flavor: |
            latest=${{ contains(github.ref_name, '-rc.') && 'false' || 'auto' }}

      - name: Build and push
        uses: docker/build-push-action@2cdde995de11925a030ce8070c3d77a52ffcf1c0 # v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "GITHUB_TOKEN=${{ secrets.NPM_GITHUB_TOKEN }}"
  deploy:
    name: Deploy via ssh (staging)
    uses: ./.github_custom/workflows/stag_deploy.yaml
    secrets: inherit
    needs: buildx
